version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "⬆"
    labels: [dependencies, internal]
    open-pull-requests-limit: 0

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "⬆"
    labels: [dependencies, internal]
    open-pull-requests-limit: 0

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "⬆"
    labels: [dependencies, internal]
    open-pull-requests-limit: 0

  - package-ecosystem: docker-compose
    directory: /docker
    schedule:
      interval: weekly
    commit-message:
      prefix: "⬆"
    labels: [dependencies, internal]
    open-pull-requests-limit: 0
