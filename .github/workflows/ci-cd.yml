name: SV Rap 8 CI/CD Pipeline

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '**.sh'
      - '.gitignore'
      - '.github/**'
      - 'scripts/**'
      - 'htmlcov/**'
      - '*.egg-info/**'
      - 'coverage.xml'
      - 'CODE_OF_CONDUCT.md'
      - 'CONTRIBUTING.md'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Tests overslaan (alleen handmatige uitvoering)"
        required: false
        default: false
        type: boolean
      skip_image_build:
        description: "Image-build overslaan (gebruik een bestaande image-tag)"
        required: false
        default: false
        type: boolean
      image_tag:
        description: "Bestaande image-tag wanneer de image-build wordt overgeslagen"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: prod-${{ github.event.pull_request.base.ref || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Run Django Tests & Quality Checks
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.merged == true)
      && (github.event_name != 'workflow_dispatch' || inputs.skip_tests != true)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: test_rap_web
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.3

      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

      - name: Set up Python 3.12
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.12

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.11.7"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-pre-commit-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            postgresql-client \
            libpq-dev \
            build-essential

      - name: Install Python dependencies
        run: uv sync --locked --no-install-project

      - name: Run pre-commit checks
        run: uv run --locked --no-sync pre-commit run --all-files

      - name: Run Django system check
        working-directory: ./web
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_rap_web
          POSTGRES_DB: test_rap_web
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_PORT: 5432
          POSTGRES_HOST: localhost
          REDIS_URL: redis://localhost:6379/0
          DJANGO_SECRET_KEY: test-secret-key-for-ci-pipeline
          DJANGO_DEBUG: True
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
        run: |
          uv run --locked --no-sync python manage.py check --deploy

      - name: Run Django migrations
        working-directory: ./web
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_rap_web
          POSTGRES_DB: test_rap_web
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_PORT: 5432
          POSTGRES_HOST: localhost
          REDIS_URL: redis://localhost:6379/0
          DJANGO_SECRET_KEY: test-secret-key-for-ci-pipeline
          DJANGO_DEBUG: True
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
        run: |
          uv run --locked --no-sync python manage.py migrate

      - name: Run Django tests
        working-directory: ./web
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_rap_web
          POSTGRES_DB: test_rap_web
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_PORT: 5432
          POSTGRES_HOST: localhost
          REDIS_URL: redis://localhost:6379/0
          DJANGO_SECRET_KEY: test-secret-key-for-ci-pipeline
          DJANGO_DEBUG: True
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
        run: |
          uv run --locked --no-sync python manage.py test --settings=rap_web.test_settings --verbosity=2

  build:
    name: Build and push image
    if: >-
      always()
      && (github.event_name != 'pull_request' || github.event.pull_request.merged == true)
      && (github.event_name != 'workflow_dispatch' || inputs.skip_image_build != true)
      && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image-tag: ${{ steps.tag.outputs.image-tag }}
      commit-sha: ${{ steps.tag.outputs.commit-sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.3
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive lowercase image id and tag
        id: tag
        run: |
          REPO="${{ github.repository }}"
          OWNER="$(echo "$REPO" | cut -d/ -f1 | tr '[:upper:]' '[:lower:]')"
          NAME="$(echo "$REPO" | cut -d/ -f2 | tr '[:upper:]' '[:lower:]')"
          IMAGE_ID="${{ env.REGISTRY }}/${OWNER}/${NAME}"
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"

          echo "IMAGE_ID=${IMAGE_ID}" >> $GITHUB_ENV
          echo "image-tag=sha-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "commit-sha=${COMMIT_SHA}" >> $GITHUB_OUTPUT

            echo "🏷️ Image will be tagged as: ${IMAGE_ID}:sha-${SHORT_SHA}"

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_ID }}
          tags: |
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    if: >-
      always()
      && (github.event_name != 'pull_request' || github.event.pull_request.merged == true)
      && (needs.test.result == 'success' || needs.test.result == 'skipped')
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    needs: [test, build]
    environment:
      name: production
      url: https://rap8.nl

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.3

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        env:
          NEW_IMAGE_TAG: ${{ needs.build.outputs.image-tag || inputs.image_tag || 'latest' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          command_timeout: 20m
          envs: NEW_IMAGE_TAG
          script: |
            set -e
            echo "🚀 Starting deployment for SV Rap 8..."
            echo "📦 New image tag: ${NEW_IMAGE_TAG}"

            # Navigate to project directory
            cd ~/rap/docker

            # Keep the production-only environment file out of the checkout reset.
            # It contains VPS secrets and must not be replaced by repository defaults.
            if [ ! -f .env ]; then
              echo "❌ Production environment file is missing: ~/rap/docker/.env"
              exit 1
            fi
            production_env_backup="$(mktemp)"
            cp .env "$production_env_backup"
            trap 'rm -f "$production_env_backup"' EXIT

            # Pull latest code
            git fetch origin --prune
            git checkout main
            git reset --hard origin/main
            cp "$production_env_backup" .env

            # Function to test deployment with a specific tag
            test_deployment() {
              local tag="$1"
              echo "🧪 Testing deployment with tag: $tag"

              # Update IMAGE_TAG in .env
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$tag/" .env

              # Pull the specific image
              if ! docker compose -f docker-compose.yml pull -q; then
                echo "❌ Failed to pull images for tag: $tag"
                return 1
              fi

              # Restart services
              if ! docker compose -f docker-compose.yml up -d --remove-orphans; then
                echo "❌ Failed to start services with tag: $tag"
                return 1
              fi

              # Wait a moment for services to initialize
              sleep 10

              # Check health of services
              local url="https://rap8.nl/health/"
              local max_attempts=30
              local sleep_sec=2
              local last_body=""

              echo "🔍 Checking ${url} for status healthy"
              for i in $(seq 1 "$max_attempts"); do
                local body="$(curl -fsS --max-time 3 "$url" || true)"
                if [ -n "$body" ]; then
                  last_body="$body"
                  if printf '%s' "$body" | tr -d '[:space:]' | grep -q '"status":"healthy"'; then
                    echo "✅ Service is healthy with tag: $tag"
                    return 0
                  fi
                fi
                printf '.'
                sleep "$sleep_sec"
                if [ "$i" -eq "$max_attempts" ]; then
                  echo
                  echo "❌ Health check failed after $((max_attempts*sleep_sec)) seconds with tag: $tag"
                  echo "Last response body:"
                  printf '%s\n' "${last_body:-<empty>}"
                  return 1
                fi
              done
            }

            validate_production_config() {
              local missing=0
              local variable
              local value
              local required_variables=(
                DJANGO_SECRET_KEY DJANGO_ALLOWED_HOSTS POSTGRES_DB
                POSTGRES_USER POSTGRES_PASSWORD POSTGRES_HOST REDIS_URL
                TRUSTED_PROXY_IPS EMAIL_HOST EMAIL_HOST_USER EMAIL_HOST_PASSWORD
                DEFAULT_FROM_EMAIL SITE_URL ADMIN_URL
              )

              for variable in "${required_variables[@]}"; do
                value="$(sed -n "s/^${variable}=//p" .env | head -n 1)"
                if [ -z "$value" ]; then
                  echo "❌ Missing production setting: ${variable}"
                  missing=1
                fi
              done

              if [ "$(sed -n 's/^DJANGO_DEBUG=//p' .env | head -n 1)" != "False" ]; then
                echo "❌ DJANGO_DEBUG must be False in production"
                missing=1
              fi
              if [ "$(sed -n 's/^POSTGRES_HOST=//p' .env | head -n 1)" != "db" ]; then
                echo "❌ POSTGRES_HOST must be the Compose service name db"
                missing=1
              fi
              if [ "$(sed -n 's/^REDIS_URL=//p' .env | head -n 1)" != "redis://redis:6379/0" ]; then
                echo "❌ REDIS_URL must use the Compose service name redis"
                missing=1
              fi
              case "$(sed -n 's/^SITE_URL=//p' .env | head -n 1)" in
                https://*) ;;
                *) echo "❌ SITE_URL must use https://"; missing=1 ;;
              esac
              case "$(sed -n 's/^DJANGO_ALLOWED_HOSTS=//p' .env | head -n 1)" in
                *rap8.nl*) ;;
                *) echo "❌ DJANGO_ALLOWED_HOSTS must include rap8.nl"; missing=1 ;;
              esac

              for secret_file in vapid_private_key vapid_public_key; do
                if [ ! -s "$secret_file" ]; then
                  echo "❌ Missing or empty VAPID secret file: ${secret_file}"
                  missing=1
                fi
              done

              if ! docker compose -f docker-compose.yml config --quiet; then
                echo "❌ Production Compose configuration is invalid"
                missing=1
              fi

              if [ "$missing" -ne 0 ]; then
                return 1
              fi

              # Verify the non-root application user can read mounted secrets.
              if ! docker compose -f docker-compose.yml run --rm --no-deps \
                --entrypoint python web -c \
                'from pathlib import Path; assert all(Path(p).is_file() and Path(p).stat().st_size for p in ("/run/secrets/vapid_private_key", "/run/secrets/vapid_public_key"))'; then
                echo "❌ The django container user cannot read the VAPID secrets"
                return 1
              fi
            }

            validate_production_config

            # Read last successful deployment tag
            last_successful_tag="latest"
            if [ -f .last-successful-deployment ]; then
              last_successful_tag="$(cat .last-successful-deployment)"
              echo "📋 Last successful deployment tag: $last_successful_tag"
            else
              echo "📋 No previous successful deployment found, using 'latest'"
            fi

            # Deploy the immutable image built and tested for this commit.
            if test_deployment "$NEW_IMAGE_TAG"; then
              echo "🎉 Deployment successful with ${NEW_IMAGE_TAG}!"
              echo "$NEW_IMAGE_TAG" > .last-successful-deployment
            else
              echo "❌ Deployment failed, attempting fallback..."

              # Try with last successful tag if it's different from latest
              if [ "$last_successful_tag" != "$NEW_IMAGE_TAG" ] && [ "$last_successful_tag" != "latest" ]; then
                echo "🔄 Attempting rollback to last successful tag: $last_successful_tag"
                if test_deployment "$last_successful_tag"; then
                  echo "✅ Rollback successful with tag: $last_successful_tag"
                  echo "⚠️  Deployment completed using fallback. Latest changes were not deployed."
                else
                  echo "💥 Rollback also failed! Manual intervention required."
                  # Show recent logs to aid debugging
                  echo "Recent web logs:"
                  docker compose -f docker-compose.yml logs --tail=200 web || true
                  exit 1
                fi
              else
                echo "💥 No fallback available (last successful was also 'latest'). Manual intervention required."
                # Show recent logs to aid debugging
                echo "Recent web logs:"
                docker compose -f docker-compose.yml logs --tail=200 web || true
                exit 1
              fi
            fi

            echo "🏁 Deployment process completed!"
