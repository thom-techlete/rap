[project]
name = "rap-web"
version = "0.1.0"
description = "SV Rap 8 Django web application."
readme = "README.md"
requires-python = ">=3.12,<4.0"
authors = [{ name = "Thom Ezechiels", email = "thom@techletes.ai" }]
maintainers = [{ name = "Techletes DevOps Team", email = "dev@techletes.ai" }]
keywords = ["django", "web", "rap"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "celery>=5.5,<6.0",
  "django>=5.2,<6.0",
  "django-anymail>=13.0,<16.0",
  "django-axes>=8.0,<9.0",
  "django-celery-beat>=2.8,<3.0",
  "django-celery-results>=2.6,<3.0",
  "django-cors-headers>=4.7,<5.0",
  "django-csp>=4.0,<5.0",
  "django-extensions>=4.1,<5.0",
  "django-ratelimit>=4.1,<5.0",
  "gunicorn>=23,<27.0",
  "pillow>=11.3,<13.0",
  "psycopg2-binary>=2.9,<3.0",
  "python-dateutil>=2.9,<3.0",
  "python-decouple>=3.8,<4.0",
  "pytz>=2025.2",
  "pywebpush>=2.0,<3.0",
  "redis>=6.4,<8.0",
  "setuptools>=80,<85",
  "whitenoise>=6.9,<7.0",
]

[dependency-groups]
dev = [
  "bandit>=1.7,<2.0",
  "black>=26.3,<27.0",
  "build>=0.11",
  "codespell>=2.2,<3.0",
  "detect-secrets>=1.5,<2.0",
  "mypy>=1.19,<2.0",
  "nbstripout>=0.8,<1.0",
  "pip-audit>=2.10,<3.0",
  "pre-commit>=4.5,<5.0",
  "prek>=0.2.24,<1.0",
  "pydocstyle>=6.3,<7.0",
  "pygments>=2.20,<3.0",
  "pytest>=9.0,<10.0",
  "pytest-cov>=7.0,<8.0",
  "pytest-django>=4.11,<5.0",
  "pytest-xdist>=3.8,<4.0",
  "pyupgrade>=3.15,<4.0",
  "ruff>=0.14,<1.0",
  "types-python-dateutil>=2.9,<3.0",
  "types-pytz>=2025.2",
]

[project.urls]
Homepage = "https://rap8.nl"
Repository = "https://github.com/thom-techlete/rap"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.bandit]
exclude_dirs = ["web/tests", "web/*/tests", "web/*/migrations", ".venv", "venv"]
skips = ["B101", "B601"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.coverage.run]
source = ["web"]
omit = [
  "*/__pycache__/*",
  "*/tests/*",
  "*/migrations/*",
  "*/.venv/*",
  "*/venv/*",
  "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if self.debug:",
  "if settings.DEBUG",
  "raise AssertionError",
  "raise NotImplementedError",
  "if 0:",
  "if __name__ == .__main__.:",
  "class .*\\bProtocol\\):",
  "@(abc\\.)?abstractmethod",
  "except ImportError",
  "pass",
]

[tool.mypy]
python_version = "3.12"
files = ["web"]
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
no_implicit_optional = true
show_column_numbers = true
pretty = true
warn_unused_configs = true
exclude = '''
(?x)(
    ^web/.*/migrations/
  | ^web/.*/tests/
  | ^web/.*/tests\\.py$
  | ^web/.*/test_.*\\.py$
)
'''

[tool.pip-audit]
ignore = []

[tool.detect-secrets]
# Shared path exclusions used by the manual helper and pre-commit hook.
exclude_files = [
  "^tests/",
  "^web/.*/migrations/",
]

[tool.pytest.ini_options]
minversion = "9.0"
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=web",
  "--cov-report=term-missing",
  "--cov-report=html",
  "--cov-report=xml",
]
DJANGO_SETTINGS_MODULE = "rap_web.test_settings"
pythonpath = ["web"]
testpaths = ["web"]
python_files = ["tests.py", "test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.pydocstyle]
match-dir = "^(?!tests$|migrations$|management$).*"

[tool.ruff]
target-version = "py312"
line-length = 88
fix = true
respect-gitignore = true
extend-exclude = ["migrations", "tests", "alembic", "venv", ".venv"]
lint.dummy-variable-rgx = "^_|^__|^pytest$"
lint.select = ["E", "F", "I", "B", "UP"]
lint.ignore = [
  "B008",
  "E501",
]

[tool.setuptools.packages.find]
where = ["web"]
include = ["*"]
exclude = ["tests*"]

[tool.uv]
required-version = ">=0.11.7,<1.0.0"
