repos:
  - repo: local
    hooks:
      - id: check-uv-lock
        name: Check uv.lock is synchronized
        entry: uv lock --check
        language: system
        pass_filenames: false
        always_run: true

      - id: validate-branch-name
        name: Validate branch name
        entry: bash scripts/hooks/validate-branch-name.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: nbstripout-autoadd
        name: nbstripout (auto-add notebooks)
        entry: uv run --frozen nbstripout
        language: system
        types: [jupyter]

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        language_version: python3.12
        types: [python]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-json
      - id: check-yaml
        args: [--unsafe]
      - id: check-symlinks
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: pip-audit
        name: pip-audit (uv.lock)
        entry: bash scripts/hooks/run-pip-audit.sh --progress-spinner off
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: bandit
        name: bandit (security check)
        entry: uv run --frozen bandit -r web -ll --exclude web/*/migrations
        language: system
        pass_filenames: false
        types: [python]

      - id: ruff
        name: Ruff (linting and import sorting)
        entry: uv run --frozen ruff check --fix
        language: system
        types: [python]

      - id: pyupgrade
        name: pyupgrade (modernize Python syntax)
        entry: uv run --frozen pyupgrade --py312-plus
        language: system
        types: [python]

      - id: mypy
        name: mypy (type checking)
        entry: uv run --frozen mypy --config-file=pyproject.toml
        language: system
        pass_filenames: false
        types: [python]
